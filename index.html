<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entorno 3D - Three.js</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0b0f1a;
        color: #e6e9ef;
      }
      #app {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 100vh;
      }
      aside {
        padding: 24px;
        background: #121826;
        border-right: 1px solid #1f2a40;
      }
      h1 {
        margin-top: 0;
        font-size: 20px;
      }
      ul {
        padding-left: 18px;
      }
      li {
        margin-bottom: 6px;
      }
      #viewer {
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hint {
        margin-top: 16px;
        font-size: 14px;
        color: #9aa4b2;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside>
        <h1>Modelo 3D</h1>
        <p>Partes detectadas:</p>
        <ul id="parts"></ul>
        <p class="hint">
          Usa el mouse para orbitar el modelo. Al llegar a 180° aparecerá un
          elemento animado.
        </p>
      </aside>
      <main id="viewer"></main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
